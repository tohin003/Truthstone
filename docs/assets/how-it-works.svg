<svg xmlns="http://www.w3.org/2000/svg" width="880" height="452" viewBox="0 0 880 452" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">How Truthstone works</title>
<desc id="d">Your prompt and the agent's tool calls pass through the host's own hooks (Codex or Claude Code) to a local Truthstone daemon. It checks each event against your repository and the recorded evidence, with no LLM, and answers in one of four ways: stay silent and record, add a note for the agent, hold once with the reason, or ask you to sign off. If Truthstone is missing or broken, the agent works as if it were not installed.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d3c39"/></marker>
</defs>
<rect x="0.5" y="0.5" width="879" height="451" rx="8" fill="#fcfcfb" stroke="#d6d5d0"/>
<text x="24" y="34" font-size="18" font-weight="700" fill="#0b0b0b">How Truthstone works</text>
<text x="24" y="54" font-size="12.5" fill="#52514e">Everything runs on your machine, inside a git repository. The host agent does the reasoning; Truthstone does not.</text>

<!-- You -->
<rect x="24" y="78" width="150" height="104" rx="8" fill="#ffffff" stroke="#8a8984" stroke-width="1.2"/>
<text x="99" y="108" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="middle">You</text>
<text x="99" y="132" font-size="12.5" fill="#3d3c39" text-anchor="middle">write the prompt,</text>
<text x="99" y="150" font-size="12.5" fill="#3d3c39" text-anchor="middle">review the work,</text>
<text x="99" y="168" font-size="12.5" fill="#3d3c39" text-anchor="middle">sign off risky commands</text>

<!-- You <-> host -->
<line x1="178" y1="112" x2="282" y2="112" stroke="#3d3c39" stroke-width="1.5" marker-end="url(#a)"/>
<text x="230" y="104" font-size="12" fill="#3d3c39" text-anchor="middle">prompt</text>
<line x1="282" y1="150" x2="178" y2="150" stroke="#3d3c39" stroke-width="1.5" marker-end="url(#a)"/>
<text x="230" y="168" font-size="12" fill="#3d3c39" text-anchor="middle">result, or a</text>
<text x="230" y="182" font-size="12" fill="#3d3c39" text-anchor="middle">sign-off request</text>

<!-- Host -->
<rect x="286" y="78" width="236" height="104" rx="8" fill="#ffffff" stroke="#8a8984" stroke-width="1.2"/>
<text x="404" y="108" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="middle">Codex or Claude Code</text>
<text x="404" y="132" font-size="12.5" fill="#3d3c39" text-anchor="middle">the host agent and its model:</text>
<text x="404" y="150" font-size="12.5" fill="#3d3c39" text-anchor="middle">reads, edits, runs commands,</text>
<text x="404" y="168" font-size="12.5" fill="#3d3c39" text-anchor="middle">then says "done"</text>

<!-- host <-> Truthstone -->
<line x1="526" y1="112" x2="638" y2="112" stroke="#3d3c39" stroke-width="1.5" marker-end="url(#a)"/>
<text x="582" y="104" font-size="12" fill="#3d3c39" text-anchor="middle">hook events</text>
<line x1="638" y1="150" x2="526" y2="150" stroke="#3d3c39" stroke-width="1.5" marker-end="url(#a)"/>
<text x="582" y="168" font-size="12" fill="#3d3c39" text-anchor="middle">its answer</text>

<!-- Truthstone -->
<rect x="642" y="78" width="214" height="104" rx="8" fill="#eaf1fa" stroke="#1c5cab" stroke-width="1.6"/>
<text x="749" y="108" font-size="16" font-weight="700" fill="#0f3f7a" text-anchor="middle">Truthstone daemon</text>
<text x="749" y="132" font-size="12.5" fill="#1f2f45" text-anchor="middle">local (127.0.0.1), no LLM;</text>
<text x="749" y="150" font-size="12.5" fill="#1f2f45" text-anchor="middle">checks each event against</text>
<text x="749" y="168" font-size="12.5" fill="#1f2f45" text-anchor="middle">your repo and the evidence</text>

<!-- hooks strip -->
<rect x="24" y="198" width="598" height="30" rx="6" fill="#f1f0ec" stroke="#d6d5d0"/>
<text x="323" y="218" font-size="12" fill="#3d3c39" text-anchor="middle"><tspan font-weight="700" fill="#0b0b0b">The host's own hooks:</tspan> SessionStart · UserPromptSubmit · PreToolUse · PostToolUse · Stop · SessionEnd</text>

<!-- bracket to answers -->
<line x1="758" y1="182" x2="758" y2="256" stroke="#3d3c39" stroke-width="1.5"/>
<line x1="122" y1="256" x2="758" y2="256" stroke="#3d3c39" stroke-width="1.5"/>
<line x1="122" y1="256" x2="122" y2="276" stroke="#3d3c39" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="334" y1="256" x2="334" y2="276" stroke="#3d3c39" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="546" y1="256" x2="546" y2="276" stroke="#3d3c39" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="758" y1="256" x2="758" y2="276" stroke="#3d3c39" stroke-width="1.5" marker-end="url(#a)"/>
<text x="24" y="250" font-size="12.5" font-weight="700" fill="#0b0b0b">It answers in one of four ways</text>

<!-- answer 1: silent -->
<rect x="24" y="280" width="196" height="118" rx="8" fill="#f4f4f2" stroke="#8a8984" stroke-width="1.2"/>
<text x="38" y="304" font-size="14.5" font-weight="700" fill="#0b0b0b">1  Stays silent</text>
<text x="38" y="326" font-size="12.5" fill="#3d3c39">Ordinary work. What it</text>
<text x="38" y="344" font-size="12.5" fill="#3d3c39">notices goes to its local</text>
<text x="38" y="362" font-size="12.5" fill="#3d3c39">log, not to the agent.</text>

<!-- answer 2: note -->
<rect x="236" y="280" width="196" height="118" rx="8" fill="#eaf1fa" stroke="#1c5cab" stroke-width="1.2"/>
<text x="250" y="304" font-size="14.5" font-weight="700" fill="#0f3f7a">2  Adds a note</text>
<text x="250" y="326" font-size="12.5" fill="#1f2f45">At the prompt: what the</text>
<text x="250" y="344" font-size="12.5" fill="#1f2f45">request takes for granted,</text>
<text x="250" y="362" font-size="12.5" fill="#1f2f45">with the evidence.</text>

<!-- answer 3: hold -->
<rect x="448" y="280" width="196" height="118" rx="8" fill="#fdf3e1" stroke="#a86b00" stroke-width="1.2"/>
<text x="462" y="304" font-size="14.5" font-weight="700" fill="#6b4300">3  Holds once</text>
<text x="462" y="326" font-size="12.5" fill="#4a3510">An edit on a false premise,</text>
<text x="462" y="344" font-size="12.5" fill="#4a3510">or a "done" the evidence</text>
<text x="462" y="362" font-size="12.5" fill="#4a3510">contradicts, with the</text>
<text x="462" y="380" font-size="12.5" fill="#4a3510">reason.</text>

<!-- answer 4: sign-off -->
<rect x="660" y="280" width="196" height="118" rx="8" fill="#fbebe5" stroke="#b5401a" stroke-width="1.2"/>
<text x="674" y="304" font-size="14.5" font-weight="700" fill="#7a2508">4  Asks you</text>
<text x="674" y="326" font-size="12.5" fill="#4d2214">A risky command, such as</text>
<text x="674" y="344" font-size="12.5" fill="#4d2214">a force push, waits for</text>
<text x="674" y="362" font-size="12.5" fill="#4d2214">your sign-off, with the</text>
<text x="674" y="380" font-size="12.5" fill="#4d2214">reason.</text>

<text x="24" y="428" font-size="12.5" fill="#52514e">It never approves anything for you. If Truthstone is missing or broken, the agent works as if it were not installed.</text>
</svg>
