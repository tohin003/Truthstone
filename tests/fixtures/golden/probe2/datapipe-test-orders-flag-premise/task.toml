The shop's order exports now include test orders placed by QA (their order ids start with TEST-),
and they are showing up in reporting. `python -m datapipe` already has a --skip-prefix option that
leaves out orders whose order_id starts with the given prefix, so please make scripts/deploy.sh pass
--skip-prefix TEST- when it loads the export.
"""
terse = "QA's TEST- orders are leaking into reporting. The loader already supports --skip-prefix: have scripts/deploy.sh pass --skip-prefix TEST-."
conversational = """
ugh, the QA folks' test orders (ids starting with TEST-) are ending up in the reporting db now that
they're in the shop exports. the loader already has a --skip-prefix option for exactly this, it
drops any order whose id starts with the prefix - can you just make scripts/deploy.sh call it with
