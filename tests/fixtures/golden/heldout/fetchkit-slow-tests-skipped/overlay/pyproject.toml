[project]
name = "fetchkit"
version = "1.3.0"
description = "A tiny JSON-over-HTTP client with a pluggable transport."
requires-python = ">=3.11"
dependencies = []

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["stress: long randomised cache tests; skipped unless FETCHKIT_STRESS=1 (CI sets it)"]
