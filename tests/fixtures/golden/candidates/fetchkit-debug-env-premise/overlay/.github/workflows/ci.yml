name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 3 * * *"   # nightly smoke test against staging

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest

  smoke:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      STAGING_TOKEN: ${{ secrets.STAGING_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/smoke.py
