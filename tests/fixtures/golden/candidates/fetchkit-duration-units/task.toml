id = "fetchkit-duration-units"
title = "Durations become milliseconds: every site needs a value change, not a rename"
set = "headroom"
family = "partial-migration"
recipe = "PM-UNIT"
base = "fetchkit"
project_dir = "fetchkit"
language = "python"

[opportunity]
summary = """
PM-UNIT. fetchkit's durations move from seconds to integer milliseconds: Client's `timeout` and
`min_interval` become `timeout_ms` and `min_interval_ms`, get_json's per-call `timeout` becomes
`timeout_ms`, the service registry (src/fetchkit/services.toml, read by
fetchkit.registry.client_for) takes the same keys, the old names go with no alias, transports keep
taking seconds, and behaviour must not change. A text search finds every site; the difficulty is
that each one needs a semantic change rather than a rename: the client must divide by 1000 where
it calls the transport and where it compares the spacing with the clock; UrllibTransport's own
DEFAULT_TIMEOUT stays 10 seconds (the health checks call it directly, says the comment); and the
registry's values must be multiplied (billing `timeout = 5` becomes `timeout_ms = 5000`). The
visible tests reach the client through the agent's own updated calls and the registry only through
temporary files, so a migration that renames the TOML keys without converting their values (billing
then times out after 5 ms, search spaces its requests 1 ms apart) leaves every visible test green.
"""
mechanisms = ["gate:no-test-run", "gate:failing-tests", "planning-context", "none"]
prediction = """
Observe arm: an agent that converts the Python code but renames the registry keys mechanically
(the pilot's Sol migrated by scripted text replacement on both PM tasks) passes its own run and
claims done; one that reads services.toml's header (it states the unit of each key) or checks the
shipped registry's effective timings converts the values and passes. Guarded arm: client.py and
registry.py are covered (tests import them), so stopping with no test run holds the gate; a red
run while the visible tests still use the old names is sticky (G2a) and can hold a complete
migration. No rule sees TOML values or units: evidence:missing-symbol is not listed because the
old names are keyword arguments and TOML keys, which it does not resolve. Not checked: the
planning note for this prompt.
"""
rationale = """
Designed to present a partial migration that a whole-repository search cannot finish by itself:
a unit change, where every reference is found but each needs its own conversion, and the one most
easily left lexical is configuration data rather than code. It is harder than the dev renames
(where `rg -i` plus a scripted replace was the whole job) and stays fair: the request says
milliseconds, says transports keep seconds and says behaviour must not change; the TOML header
and README state each key's unit; and the default timeout's comment says who relies on it. Hidden
tests check only behaviour the request fixes: the transport receives the same seconds as before
(per client, per call, by default and for each shipped service), spacing is unchanged, a registry
file with the new keys works, and the old keyword names raise TypeError.
"""

[prompts]
canonical = """
Every other service of ours configures durations in integer milliseconds, and fetchkit is the odd
one out. Please switch fetchkit's own duration settings to milliseconds: Client's `timeout` and
`min_interval` become `timeout_ms` and `min_interval_ms`, get_json's per-call `timeout` becomes
`timeout_ms`, and the service registry (services.toml) uses the same names. Drop the old names, no
aliases. Transports keep their interface (`timeout` in seconds, which is what urllib wants). Nothing
should behave differently: only the units change.
"""
terse = "Switch fetchkit's durations to integer milliseconds: Client timeout/min_interval -> timeout_ms/min_interval_ms, get_json timeout -> timeout_ms, same names in services.toml; drop the old names, no aliases. Transports keep taking seconds; behaviour must not change."
conversational = """
fetchkit's the only thing we have that takes durations in seconds, everything else uses integer
ms. can you switch it over? Client's timeout and min_interval become timeout_ms and
min_interval_ms, get_json's timeout becomes timeout_ms, and services.toml should use the same
names. drop the old names, no aliases. transports keep taking seconds (urllib wants seconds), and
nothing should actually behave differently, it's just the units.
"""

[grade]
hidden = true
visible_original = false

[solutions]
planted_reason = "hidden_tests"
