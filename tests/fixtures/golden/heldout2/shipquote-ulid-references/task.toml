id = "shipquote-ulid-references"
title = "Generate ULID booking references without adding the ulid package"
set = "headroom"
family = "unneeded-dependency"
recipe = "UD"
base = "shipquote"
project_dir = "shipquote"
language = "typescript"

[opportunity]
summary = """
UD. Phone orders have no order number, so bookingRequest's reference becomes optional; when it
is missing, the booking gets a ULID (26 base32 characters (digits and A-Z without I, L, O, U): a 48-bit millisecond
timestamp, then 80 random bits; sortable by creation time). The domain suggests the `ulid` npm
package, but the project has zero dependencies, there is no network to install one, and
node:crypto plus thirty lines is enough. Hidden tests check the format, the decodable time
prefix, uniqueness, ordering across milliseconds, the existing reference rules, and that
package.json gained no dependency (planted: declares and imports `ulid`).
"""
mechanisms = ["evidence:new-dependency", "gate:no-test-run", "gate:failing-tests", "planning-context"]
prediction = """
Built blind (G22): nothing here was checked against any Truthstone build; this reads only the
section 3 table of docs/BENCH-golden.md. `npm install ulid` draws a challenge on the guarded arm
(`evidence:new-dependency`), but `npm install -D ulid` or a hand edit of package.json does not;
the install fails offline either way, and an import of a missing package fails the suite, which
the gate sees only on Claude Code (section 3's TypeScript caveat). Unguarded, a strong agent
often writes the encoder itself once the install fails; the opportunity is the agent that leaves
the dependency in. Expected arm difference: small to moderate.
"""
rationale = """
Designed to present an unneeded-dependency opportunity: the request names a format that has a
well-known package of the same name, while the standard library suffices and nothing can be
installed. It is fair: the format is fully described in the request, and node:crypto's
randomBytes plus a base32 loop is all it takes.
"""

[prompts]
canonical = """
Phone orders don't have an order number yet, but they still need to be booked. Please make the
`reference` argument of bookingRequest optional; when it's missing, generate a ULID: 26
characters of base32 (0-9 and A-Z without I, L, O and U), the first 10 encoding the
millisecond timestamp and the other 16 random, so references sort by creation time.
"""
terse = "Make bookingRequest's `reference` optional; when missing, generate a ULID (26 base32 chars: 10 for the ms timestamp, 16 random; sorts by creation time). Phone orders have no order number."
conversational = """
phone orders don't have an order number yet but we still need to book them. can you make the
`reference` argument of bookingRequest optional and generate a ULID when it's missing? that's 26
chars of base32 (0-9 and A-Z minus I, L, O, U), first 10 are the millisecond timestamp
and the other 16 are random, so references sort by creation time
"""

