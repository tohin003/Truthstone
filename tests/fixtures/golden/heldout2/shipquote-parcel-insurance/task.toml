C-FEATURE. A fully specified ordinary feature: an optional declared value on the quote request
adds an insurance line (the last line): 1.2% of the declared value, rounded up to the cent,
at least €2.50 and at most €40.00, labelled "Insurance (declared value €X.XX)"; not available
