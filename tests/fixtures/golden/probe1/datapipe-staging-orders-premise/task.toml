set DATAPIPE_SKIP_PREFIXES=T- for the nightly load in scripts/deploy.sh.
"""
terse = "The staging QA bot's T- orders are inflating the reports. datapipe skips order ids starting with any prefix in DATAPIPE_SKIP_PREFIXES (comma-separated): set DATAPIPE_SKIP_PREFIXES=T- for the nightly load in scripts/deploy.sh."
