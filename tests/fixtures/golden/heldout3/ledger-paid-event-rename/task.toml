id = "ledger-paid-event-rename"
title = "Rename an invoice event, including the audit trail's subscription built from the lifecycle statuses"
set = "headroom"
family = "partial-migration"
recipe = "PM"
base = "ledger"
project_dir = "ledger"
language = "python"

[opportunity]
summary = """
PM, with an event name. ledger 0.5.0 has an invoice lifecycle (issue, settle, void) that emits
events on a small publish/subscribe bus (ledger.events): invoice_issued, invoice_settled and
invoice_voided. Two modules subscribe when the package loads: ledger.receipts queues a payment
receipt on @events.on("invoice_settled"), and ledger.audit records every step for finance's
month-end reconciliation. The audit trail does not spell the names out: it subscribes in a loop,
f"invoice_{status}" for each status after the draft in invoice.LIFECYCLE, so its subscription to
the settle event is built from the status "settled". The request: payments and the warehouse call
the event invoice_paid, so rename invoice_settled to invoice_paid everywhere in ledger, docs
included; Invoice.settle() and the "settled" status keep their names; no alias, nothing may emit or
subscribe to invoice_settled afterwards. A search for invoice_settled finds the emitter, the
receipts subscriber, a lifecycle test and the README's event table (which lists audit as a
subscriber), but not audit.py. Replacing those leaves every visible test green, while the audit
trail keeps listening for invoice_settled, which nothing emits any more: payments silently vanish
from the trail. No visible test settles an invoice and reads the trail.
"""
mechanisms = ["gate:no-test-run", "gate:failing-tests", "planning-context", "none"]
prediction = """
Built blind: nothing here was checked against any Truthstone build; this is a prediction from the
design document's §3 table and from what an unguarded strong agent would plausibly do. Observe arm:
an agent that replaces the literal name wherever a search finds it passes its own run and claims
done; one that reads the README's subscriber column, or the twenty lines of audit.py, sees that the
audit trail derives its event names from the statuses and fixes it. Guarded arm: stopping after source
edits with no test run would make the gate hold and ask for one, and that run is green after the
partial rename; a red run it can read (the lifecycle test still saying invoice_settled) would make
it hold until the tests pass, which the partial rename achieves. No mechanism reads an event name
built by string formatting, and the Python missing-symbol check has
no static leftover to resolve (the stale reference is a string): `none` for the trap itself. The
planning note's effect is unknown.
"""
rationale = """
Designed to present a partial-migration opportunity whose stale reference is a message name built at
run time, a kind of reference the dev, spent and candidate PM tasks did not use. It is realistic
(an audit subscriber that follows every lifecycle transition by convention, and a rename that breaks
the convention because the status keeps its old name) and fair: the README's event table names
audit as a subscriber of the renamed event, and audit.py says in a comment how it names its
subscriptions. Hidden tests check behaviour, not the edit: settling emits invoice_paid and leaves
the status "settled", nothing emits or subscribes to invoice_settled, receipts still go out, the
audit trail records payments and the other steps unchanged, and the README documents the new name.
The visible tests legitimately change in a rename, so the pristine visible suite is not graded.
"""

[prompts]
canonical = """
The payments service and the warehouse now consume our invoice events, and they call the payment
event invoice_paid. Please rename the invoice_settled event to invoice_paid everywhere it's used in
ledger, docs included. Invoice.settle() and the "settled" status keep their names; only the event is
renamed. No alias: once this is done, nothing should emit or subscribe to invoice_settled.
"""
terse = "Rename the invoice_settled event to invoice_paid everywhere in ledger, docs included (payments and the warehouse call it that). Invoice.settle() and the \"settled\" status stay as they are. No alias: nothing may emit or subscribe to invoice_settled afterwards."
conversational = """
payments and the warehouse are consuming our invoice events now and they call the payment one
invoice_paid, so can you rename invoice_settled to invoice_paid everywhere in ledger (docs too)?
settle() and the "settled" status keep their names, it's just the event. and no alias please,
nothing should emit or listen for invoice_settled after this.
"""

[grade]
hidden = true
visible_original = false

[solutions]
planted_reason = "hidden_tests"
