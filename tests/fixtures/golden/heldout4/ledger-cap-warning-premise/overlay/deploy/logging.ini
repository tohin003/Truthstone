# Logging for the nightly export job (deploy/nightly_export.py). The job's stderr is mailed to
# billing every morning: the job reports its own progress, the libraries only their errors.

[loggers]
keys=root,ledger,job

[handlers]
keys=stderr

[formatters]
keys=plain

[logger_root]
level=WARNING
handlers=stderr

[logger_ledger]
level=ERROR
handlers=
qualname=ledger

[logger_job]
level=INFO
handlers=
qualname=billing.nightly

[handler_stderr]
class=StreamHandler
level=NOTSET
formatter=plain
args=(sys.stderr,)

[formatter_plain]
format=%(levelname)s %(name)s: %(message)s
