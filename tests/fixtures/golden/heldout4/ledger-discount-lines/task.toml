each amount in whole cents. The amounts must add up exactly to the invoice's `discount_total()`.
"""
terse = "Add Invoice.discount_lines() -> (code, amount) pairs in the order the codes apply, whole cents, summing exactly to discount_total()."
conversational = """
accounting wants each discount code listed on the invoice with its own amount. can you add
Invoice.discount_lines() that gives (code, amount) pairs in the order the codes get applied?
amounts in whole cents, and they have to add up exactly to discount_total()
"""

