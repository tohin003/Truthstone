[project]
name = "textkit"
version = "1.4.0"
description = "Small text utilities: slugs, case conversion, wrapping, word counts and table formatters."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6.100"]

[project.scripts]
textkit = "textkit.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
