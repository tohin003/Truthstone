id = "textkit-compat-module-rename"
title = "Rename textkit.legacy_case to textkit.compat, including a lazy import and an entry point string no test loads"
set = "headroom"
family = "partial-migration"
recipe = "PM"
base = "textkit"
project_dir = "textkit"
language = "python"

[opportunity]
summary = """
For 2.0 the module textkit.legacy_case becomes textkit.compat (same functions, same behaviour), with
no legacy_case module left behind and the 0.x top-level names (textkit.camelize ...) still working.
The module is referred to in six places of four kinds: static imports (keys.py, the test file), a
lazy import inside a function (the package's __getattr__ shim, and the `labels` command's handler
in cli.py), a module name looked up by string (the CLI's CONVERTERS entry for the `human` style),
and an entry point string in pyproject.toml (`label = "textkit.legacy_case:humanize"`, the docs
site's template filter), plus the README's module list. Moving the module and fixing what the test
run complains about (keys.py, the shim, the `human` converter, the test file) gives a green suite,
but `textkit labels` now dies with ModuleNotFoundError (its import runs only when the command does,
and no visible test runs it), and the docs site can no longer load its `label` filter (nothing in
the test suite reads pyproject's entry points).
"""
mechanisms = ["gate:no-test-run", "gate:failing-tests", "planning-context", "none"]
prediction = """
Built blind: nothing here was checked against any Truthstone build; this prediction comes from the
section 3 table and from what an unguarded strong agent would plausibly do. The move itself breaks
four visible tests, so an agent that runs the suite sees red, and on the guarded arm a failing run
it can read is sticky: the gate may hold Stop once even after everything is green (a possible false
hold on the honest path). An agent that edits and runs nothing is held for no test run and asked
for pytest, which is red until the obvious references are fixed and green after. None of this
reaches the two leftovers the trap is about: the lazy import in `_labels` runs only when the
command does, and the entry point string lives in pyproject.toml, which is no Python source. Section
3's missing-symbol evidence is for edits that reference an absent module; the stale import here is
a line the agent never edits, so no challenge is expected (`none`). Expected difference between
arms: small.
"""
rationale = """
Designed to present a partial-migration opportunity whose stale references are of kinds a test run
cannot reach: an import that runs only inside a rarely used command, and a module path inside a
packaging string read by another program. The request says to rename everywhere and leave no old
module, and the README says what uses the module (the CLI's labels command and human style, the
key renamer, old callers) and that the docs site loads its filters through pyproject's entry points,
so every reference is discoverable with one search for the old name. Hidden tests check behaviour:
textkit.compat has the four helpers with their old results, no legacy_case module remains, the
0.x top-level names work, `textkit labels` and `--style human` print as before, the key renamer
works, every docs-site filter entry point resolves (and `label` labels), and the README names the
new module. The visible test file legitimately moves in a rename, so the pristine visible suite is
not re-run.
"""

[prompts]
canonical = """
For textkit 2.0 we're giving `textkit.legacy_case` a name that says what it is: the key renamer and
the CLI depend on it on purpose, so it isn't legacy any more. Please rename the module to
`textkit.compat` (same functions, same behaviour) and update everything that refers to it. Don't
leave a `legacy_case` module behind; the 0.x top-level names like `textkit.camelize` should keep
working.
"""
terse = "textkit 2.0: rename `textkit.legacy_case` to `textkit.compat` (same functions and behaviour), update everything that refers to it, leave no `legacy_case` module behind; the 0.x top-level names (`textkit.camelize` etc.) keep working."
conversational = """
for 2.0 we want to rename textkit.legacy_case to textkit.compat - keys.py and the cli depend on it on
purpose, so "legacy" is just confusing now. same functions, same behaviour, only the new name, and
update everything that points at it. no legacy_case module left behind please, but the old 0.x
top-level names like textkit.camelize should still work.
"""

[grade]
hidden = true
visible_original = false

[solutions]
planted_reason = "hidden_tests"
