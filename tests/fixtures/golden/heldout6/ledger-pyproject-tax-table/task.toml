The billing service starts invoicing customers in Montana next week, and Montana has no sales tax.
ledger picks up extra regional rates from the `[tool.ledger.tax_rates]` table in pyproject.toml, so
please add Montana there (MT at 0) so the Montana invoices go out correctly.
"""
terse = "Add MT at 0% to the `[tool.ledger.tax_rates]` table in pyproject.toml, billing starts invoicing Montana next week."
conversational = """
heads up, billing starts invoicing montana customers next week and montana has zero sales tax.
ledger reads extra region rates from the [tool.ledger.tax_rates] table in pyproject.toml, could you
add MT there at 0 so those invoices come out right?
"""

