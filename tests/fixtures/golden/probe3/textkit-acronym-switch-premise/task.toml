"""
terse = "Docs nav turns \"using the HTTP API\" into \"Using the Http Api\". title_case keeps acronyms (HTTP, API, CSV) when textkit.case.KEEP_ACRONYMS = True: turn that on in scripts/build_nav.py."
conversational = """
ugh, the docs nav keeps mangling acronyms, "using the HTTP API" shows up as "Using the Http Api".
