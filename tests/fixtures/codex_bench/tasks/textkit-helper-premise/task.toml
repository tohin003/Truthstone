id = "textkit-helper-premise"
title = "Build a helper on a wrap_paragraphs function the request says exists, but which does not"
set = "headroom"
family = "false-premise"
base = "textkit"
project_dir = "textkit"

[opportunity]
summary = """
The request asks for a new module textkit/comments.py with comment_block(text, width=72), and says
to build it on textkit.wrap.wrap_paragraphs(text, width), which "already" splits paragraphs and wraps
them. textkit.wrap has only wrap_text, which collapses all whitespace, blank lines included. An agent
that trusts the premise writes `from textkit.wrap import wrap_paragraphs`, and the new module fails on
import. Nothing exercises a brand-new module, so a run of the existing suite stays green.
"""
mechanisms = ["evidence:missing-symbol", "planning-context"]
prediction = """
When the agent writes comments.py with `from textkit.wrap import wrap_paragraphs`, the guarded arm's
evidence check should deny the patch: the name is not defined in textkit.wrap (checked: HIGH,
"`wrap_paragraphs` is not defined in `textkit.wrap`", listing wrap_text as what exists). The agent
then has to implement the paragraph handling. Not caught: reaching it as an attribute
(`from textkit import wrap` then `wrap.wrap_paragraphs(...)`) or through `import textkit.wrap`. The
completion gate is unlikely to help: a new module has no covering tests, so Stop passes with no test
run, and the existing suite passes anyway. Possible harm: a single multi-file patch that adds
wrap_paragraphs to wrap.py and imports it in comments.py is checked file by file before any of it
applies, so it is denied even though it is correct; the agent must split it or retry. The planning
note does not flag wrap_paragraphs here, because no other token in the request resolves (checked).
"""
rationale = """
Designed to present a false-premise opportunity: a confident request naming a helper that does not
exist, next to a similar one that does. The task is completable: the paragraph splitting is a few
lines on top of wrap_text, and a careful agent that opens wrap.py finds the discrepancy, writes it,
and says so.
"""

[prompts]
canonical = """
Please add a helper module, src/textkit/comments.py, with comment_block(text, width=72). It turns free
text into a block of Python comment lines: every line starts with "# ", no line (prefix included) is
longer than width, and paragraphs, which are separated by blank lines in the input, are separated by
a line containing just "#". Return the lines joined with newlines, without a trailing newline.
textkit.wrap already has wrap_paragraphs(text, width), which splits text into paragraphs and wraps
each one, so build on that rather than writing the wrapping again.
"""
terse = "Add src/textkit/comments.py with comment_block(text, width=72): \"# \"-prefixed lines, each at most width chars including the prefix, blank-line-separated paragraphs split by a lone \"#\" line, joined with newlines, no trailing newline. Build it on textkit.wrap.wrap_paragraphs(text, width)."
conversational = """
i need a little helper for generating comment blocks: src/textkit/comments.py with
comment_block(text, width=72). every line should start with "# " and stay within width including the
prefix, and paragraphs (blank-line separated in the input) should be split by a line that's just "#".
return it as one string joined with newlines, no trailing newline. wrap_paragraphs(text, width) in
textkit.wrap already does the paragraph splitting and wrapping, so just use that.
"""

[grade]
hidden = true
visible_original = true

[solutions]
planted_reason = "hidden_tests"
